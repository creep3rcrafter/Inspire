plugins {
    id 'com.gradleup.shadow'
}
architectury {
    platformSetupLoomIde()
    fabric()
}
fabricApi {
    configureDataGeneration() {
        client = true
    }
}
configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
}
dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    //modImplementation "maven.modrinth:cloth-config:xuX40TN5"
    //modImplementation "maven.modrinth:jade:TBoryRpS"
    //modImplementation "maven.modrinth:sodium:59wygFUQ"
    //modImplementation "maven.modrinth:iris:pvcLnrm0"
    //modImplementation "maven.modrinth:appleskin:pvcLnrm0"
    //modImplementation "maven.modrinth:mouse-tweaks:i1duwnJl"
    //modImplementation "maven.modrinth:terrablender:chxo508B"
    //modImplementation "maven.modrinth:rei:CkkZK8ao"

    modImplementation "maven.modrinth:platform:BbIdNbF1"
    modImplementation "maven.modrinth:vanillabackport:ayvoY8lx"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}
shadowJar {
    //exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}
remapJar {
    inputFile.set shadowJar.archiveFile
}
